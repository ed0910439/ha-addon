{% extends "base.html" %}
{% block title %}修改預設密碼{% endblock %}
{% block content %}
<section class="auth-card card">
  <div class="step">1 / 2</div>
  <h1>修改預設密碼</h1>
  <p class="muted">這組密碼之後會失效。新密碼至少 12 碼。</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>新密碼<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
    <label>再輸入一次<input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
    <button class="btn primary" type="submit">儲存並繼續</button>
  </form>
</section>
{% endblock %}
