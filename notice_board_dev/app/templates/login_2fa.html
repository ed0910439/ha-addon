{% extends "base.html" %}
{% block title %}第二階段驗證{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>第二階段驗證</h1>
  <p class="muted">輸入驗證器 App 目前顯示的 6 位數驗證碼。</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>驗證碼<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
    <label>這台裝置名稱<input name="device_name" maxlength="80" value="{{ device_name }}" required></label>
    <button class="btn primary" type="submit">登入並綁定裝置</button>
  </form>
</section>
{% endblock %}
