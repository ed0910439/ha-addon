name: Build Notice Board GHCR image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "notice_board/**"
      - ".github/workflows/notice-board-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          value="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' notice_board/config.yaml)"
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hass_arch: amd64
            platform: linux/amd64
          - hass_arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./notice_board
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notice-board:${{ needs.version.outputs.value }}-${{ matrix.hass_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.value }}
            BUILD_ARCH=${{ matrix.hass_arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.value }}

  manifest:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/notice-board
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-aarch64"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-aarch64"
